name: Hindi Story Video Generator
on:
  workflow_dispatch:
jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick espeak
          sudo sed -i \'s/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/\' /etc/ImageMagick-6/policy.xml || true

      - name: Libraries Install
        run: pip install --no-cache-dir edge-tts moviepy==1.0.3 Pillow requests

      - name: Video Generate - Guaranteed
        run: |
          cat > generate.py << \'PYEOF\'
          import requests, textwrap, asyncio, os, subprocess
          from PIL import Image, ImageDraw, ImageFont
          from moviepy.editor import *

          scenes = [
              {"text": "Savita apne pati ke guzar jaane ke baad bahut gareebi me jee rahi thi. Uske paas itne paise nahi the ki wo dono beto ko padha sake.", "prompt": "poor indian old mother with two young sons in small village hut sad atmosphere"},
              {"text": "Gaon ke master ji ne salah di ki Manav padhne me tez hai, use sheher bhej do. Aur Atul ko yahi mithai ki dukaan par kaam par laga do.", "prompt": "indian village teacher advising poor mother with two sons"},
              {"text": "Manav sheher chala gaya, aur chota Atul gaon ki mithai ki dukaan par kaam karne laga. Uske haathon me jaadu aa gaya.", "prompt": "indian boy making jalebi and samosa in sweet shop"},
              {"text": "Saalon baad, Manav ek bade Food Chain Company ka Senior Manager ban gaya. Usne apni maa aur bhai ko sheher bula liya.", "prompt": "indian young man in manager suit in modern office city"},
              {"text": "Lekin kamyabi ke saath Manav me ghamand bhi aa gaya. Use apna gareeb halwai bhai sharmindagi lagne laga.", "prompt": "rich indian manager ashamed of his poor brother in kitchen clothes"},
              {"text": "Boss ghar dinner par aaye. Atul ne itna swadisht khana banaya ki Boss bahut khush ho gaye.", "prompt": "indian boss eating delicious food at dinner table impressed"},
              {"text": "Boss ne kaha, Atul tumhare haathon me jaadu hai. Kya tum mere Five Star Hotel me Head Chef banoge?", "prompt": "indian boss offering chef job to young cook happy moment"},
              {"text": "Manav jal gaya aur usne chupke se Atul ki sabzi me muthi bhar namak daal diya.", "prompt": "jealous man secretly adding salt to food in hotel kitchen cctv camera"},
              {"text": "Boss ne CCTV me sach dekh liya aur Manav ko bahut daanta. Degree sirf Naukri deti hai, par Hunar Pehchan deta hai.", "prompt": "angry boss scolding manager showing cctv footage"},
              {"text": "Manav ko apni galti ka ehsaas hua. Usne Atul se maafi maangi. Ab dono bhai khushi khushi rehne lage.", "prompt": "two indian brothers hugging and apologizing mother blessing happy ending"}
          ]

          async def make_audio_edge(text, file):
              await edge_tts.Communicate(text, voice="hi-IN-MadhurNeural").save(file)

          def make_audio_espeak(text, file):
              # espeak se wav banao fir mp3 me convert
              subprocess.run(f\'espeak -v hi -s 135 "{text}" --stdout > temp.wav\', shell=True)
              subprocess.run(f\'ffmpeg -y -i temp.wav -codec:a libmp3lame -qscale:a 2 {file}\', shell=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          def make_silent_audio(duration, file):
              # agar dono fail ho to silent audio banao
              subprocess.run(f\'ffmpeg -y -f lavfi -i anullsrc=r=24000:cl=mono -t {duration} -q:a 9 -acodec libmp3lame {file}\', shell=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          clips = []
          for i, scene in enumerate(scenes):
              print(f"Scene {i+1}/10 bana raha hu...")

              # 1. IMAGE - Pollinations try, fail hua to blank image
              try:
                  url = f"https://image.pollinations.ai/prompt/{requests.utils.quote(scene[\'prompt\'])}?width=1280&height=720&nologo=true&seed={i+10}"
                  r = requests.get(url, timeout=60)
                  if r.status_code == 200 and len(r.content) > 5000:
                      open(f"img{i}.jpg","wb").write(r.content)
                      img = Image.open(f"img{i}.jpg").convert("RGB")
                  else:
                      raise Exception("Image empty")
              except Exception as e:
                  print(f"Image download fail, blank bana raha hu: {e}")
                  img = Image.new(\'RGB\', (1280, 720), color=(45, 45, 60))

              # Image par text likho
              draw = ImageDraw.Draw(img)
              try:
                  font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 30)
              except:
                  font = ImageFont.load_default()
              text_wrapped = textwrap.fill(scene[\'text\'], width=42)
              draw.rectangle([(0, 560), (1280, 720)], fill=(0,0,0))
              draw.multiline_text((40, 580), text_wrapped, font=font, fill=(255,255,255), spacing=4)
              img.save(f"final_img{i}.jpg")

              # 2. AUDIO - 3 level fallback
              audio_file = f"audio{i}.mp3"
              audio_ok = False
              try:
                  print(f"  Edge-TTS try...")
                  asyncio.run(make_audio_edge(scene[\'text\'], audio_file))
                  if os.path.exists(audio_file) and os.path.getsize(audio_file) > 1000:
                      audio_ok = True
                  else:
                      raise Exception("edge file choti hai")
              except Exception as e:
                  print(f"  Edge fail {e}, Espeak try...")
                  try:
                      make_audio_espeak(scene[\'text\'], audio_file)
                      if os.path.exists(audio_file) and os.path.getsize(audio_file) > 1000:
                          audio_ok = True
                      else:
                          raise Exception("espeak fail")
                  except Exception as e2:
                      print(f"  Espeak bhi fail {e2}, silent audio bana raha hu")
                      duration = max(4, len(scene[\'text\'])/13)
                      make_silent_audio(duration, audio_file)
                      audio_ok = True
              
              # 3. CLIP BANAO
              audio = AudioFileClip(audio_file)
              # audio bahut chota ho to kam se kam 3 sec rakho
              duration = max(audio.duration, 3.0)
              image = ImageClip(f"final_img{i}.jpg").set_duration(duration)
              image = image.set_audio(audio)
              clips.append(image)
              print(f"  Scene {i+1} OK - duration {duration:.1f}s")

          print("Sab clips bane, ab final video jod raha hu...")
          final = concatenate_videoclips(clips, method="compose")
          final.write_videofile("final_video.mp4", fps=24, codec="libx264", audio_codec="aac")
          print("VIDEO BAN GAYA - SUCCESS!")

          # Final check
          if os.path.exists("final_video.mp4"):
              print(f"File size: {os.path.getsize(\'final_video.mp4\')} bytes")
          PYEOF
          python generate.py

      - name: Force Create Video if Still Missing
        if: always()
        run: |
          ls -lh
          if [ ! -f final_video.mp4 ]; then
            echo "Fallback video bana raha hu..."
            ffmpeg -y -f lavfi -i color=c=black:s=1280x720:d=10 -vf "drawtext=text=\'Video Generated - Fallback\':fontcolor=white:fontsize=48:x=(w-text_w)/2:y=(h-text_h)/2" -c:v libx264 -t 10 final_video.mp4
          fi
          ls -lh final_video.mp4

      - name: Video Save
        uses: actions/upload-artifact@v4
        with:
          name: hindi-story-video
          path: final_video.mp4
          if-no-files-found: error
